name: Package / Publish Extension

on:
  workflow_dispatch:
    inputs:
      publish_vscode:
        description: Publish to Visual Studio Marketplace
        type: boolean
        default: false
      publish_openvsx:
        description: Publish to Open VSX
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: nwscript-workbench-vsix
          path: "*.vsix"

      - name: Publish to Visual Studio Marketplace
        if: ${{ inputs.publish_vscode }}
        run: npx vsce publish -p "${VSCE_PAT}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: ${{ inputs.publish_openvsx }}
        run: npx ovsx publish -p "${OVSX_PAT}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
